name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node >= 23.6 runs the TypeScript test files natively (type-stripping),
          # matching the local toolchain. No build step or extra deps required.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check release version metadata
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER: ${{ secrets.EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set Sentry release identifiers
        # sentry.gradle (applied from android/app/build.gradle) defaults the
        # upload's --release/--dist to `${applicationId}@${versionName}+${versionCode}`,
        # which does NOT match the release/dist Sentry.init() reports at runtime
        # (`ocx-mobile@${app.json version}`, see src/lib/sentry.ts). That
        # mismatch made every uploaded source map land under a release Sentry
        # never looks up, so symbolication silently failed. Pin the Gradle-side
        # values to exactly what the app reports.
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "SENTRY_RELEASE=ocx-mobile@${VERSION}" >> "$GITHUB_ENV"
          echo "SENTRY_DIST=${VERSION}" >> "$GITHUB_ENV"
          echo "Sentry release=ocx-mobile@${VERSION} dist=${VERSION}"

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup signing
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* && -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing: production keystore"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing: debug keystore (non-release build)"
          fi

      # Every push/PR gets a debug build (universal APK — buildAbiSplits=false
      # so it's installable and quick to compile); a release build only happens
      # on version tags, matching the signing setup above. Building assembleRelease
      # on every push cost ~10 extra minutes per run for artifacts nobody installed.
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew assembleDebug -PbuildAbiSplits=false

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload release APK artifacts (per architecture)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-*-release.apk

  # OCX is GitHub-releases-only: the F-Droid flavor job was removed.
  # See git history for the build-fdroid job if F-Droid is ever wanted.
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compose release notes from version changelog
        id: notes
        run: |
          VERSION_CODE=$(sed -n "s/.*versionCode[[:space:]]\+\([0-9]\+\).*/\1/p" android/app/build.gradle | tail -1)
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [ -f "distribution/changelogs/${VERSION_CODE}.txt" ]; then
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            sed '1d' "distribution/changelogs/${VERSION_CODE}.txt" >> "$GITHUB_OUTPUT"
            PREV_TAG=$(git describe --abbrev=0 --tags "$GITHUB_REF_NAME^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              echo >> "$GITHUB_OUTPUT"
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            fi
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "compose_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: app-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
          body: ${{ steps.notes.outputs.compose_ok == 'true' && steps.notes.outputs.body || github.event.head_commit.message }}
          generate_release_notes: true
